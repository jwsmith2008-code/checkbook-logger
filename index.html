<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Checkbook</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #b388ff;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #9575cd;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #b388ff;
            margin-top: 25px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ledger-list {
            max-height: 250px;
            overflow-y: auto;
            background: #252525;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 5px;
        }
        .ledger-item {
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ledger-item:last-child {
            border-bottom: none;
        }
        .ledger-item.pending {
            background: rgba(46, 125, 50, 0.2);
            border-left: 3px solid #81c784;
        }
        .verify-box {
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            margin-top: 15px;
        }
        .status-box {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 10px;
            background: #2a2a2a;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Morning Checkbook</h2>

    <!-- Smart Paste Box -->
    <div style="background: #252525; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed #666;">
        <label style="color: #a5d6a7; margin-bottom: 4px;">⚡ Quick Smart-Paste (Paste bank line here)</label>
        <textarea id="quickPasteInput" placeholder="Paste bank row (e.g. 11/03/2026  SHEETZ  -$25.83)..." style="height: 45px; font-family: monospace; font-size: 12px;"></textarea>
    </div>

    <form id="checkbookForm">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="payee">Payee / Description</label>
            <input type="text" id="payee" placeholder="e.g. weis, amazon, xfer" required>
        </div>
        <div class="form-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="amount">Amount ($)</label>
                <input type="number" step="0.01" id="amount" placeholder="0.00" required>
            </div>
            <div style="flex: 1;">
                <label for="type">Type</label>
                <select id="type">
                    <option value="withdrawal">Withdrawal (-)</option>
                    <option value="deposit">Deposit (+)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" placeholder="e.g. groceries, coverage, etc.">
        </div>
        <div class="form-group">
            <label for="statusTag">Status Tag / Color Coding</label>
            <select id="statusTag">
                <option value="Normal / Cleared (White)">Normal / Cleared (White)</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">Log Transaction</button>
    </form>

    <div class="section-title">
        <span>Ledger Monitor (Last 75)</span>
        <div>
            <span id="pendingCountBadge" style="font-size:11px; background:#333; padding:2px 6px; border-radius:4px; color:#81c784;">0 pending</span>
            <span id="totalPendingBadge" style="font-size:11px; background:#333; padding:2px 6px; border-radius:4px; color:#fff; margin-left:5px;">Total: $0.00</span>
        </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 8px;">
        <input type="text" id="searchFilter" placeholder="Filter by payee or amount..." style="padding: 6px 10px; font-size: 12px;">
    </div>
    
    <div id="ledgerList" class="ledger-list">
        <div style="text-align: center; color: #888; padding: 20px;">Fetching from Apps Script...</div>
    </div>

    <!-- Members 1st Quick Verify -->
    <div class="verify-box">
        <div class="section-title" style="margin-top: 0; color: #fff;">Members 1st Quick Verify</div>
        
        <div class="form-group" style="margin-bottom: 10px;">
            <label>Current Bank Overall Balance ($)</label>
            <input type="number" step="0.01" id="bankBalanceInput" placeholder="0.00">
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
            <label>Latest Sheet Balance ($)</label>
            <input type="number" step="0.01" id="latestSheetBalanceInput" readonly style="background: #1a1a1a; color: #888;">
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
            <label>Total Green Pending Float ($)</label>
            <input type="number" step="0.01" id="pendingFloatInput" readonly style="background: #1a1a1a; color: #888;">
        </div>
        
        <div id="verifyStatusBox" class="status-box">
            Enter your current bank balance to verify
        </div>

        <button type="button" id="balanceBtn" style="margin-top: 15px; background: #81c784; color: #121212;">Mark Checkbook as Balanced</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxMD7Pnri1ZQZx-gZ56IP1xox56jKaeroV9jSpnoU1TXNHZEYvVOgVhLTLlXhle4Ihu/exec";

    const dateInput = document.getElementById('date');
    if (dateInput) {
        dateInput.value = new Date().toISOString().split('T')[0];
    }

    let allEntries = [];

    // Smart Paste Parser Logic
    document.getElementById('quickPasteInput').addEventListener('input', function(e) {
        const text = e.target.value;
        const matchDate = text.match(/(\d{2}\/\d{2}(\/\d{4})?)/);
        const matchAmount = text.match(/\$?-?\d+\.\d{2}/);
        
        if (matchDate && matchAmount) {
            let dateStr = matchDate[1];
            if (!dateStr.includes('2026') && !dateStr.includes('2025')) {
                dateStr += '/' + new Date().getFullYear();
            }
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                document.getElementById('date').value = `${parts[2]}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
            }

            const rawAmtStr = matchAmount[0];
            const cleanAmt = rawAmtStr.replace('$', '').replace('-', '');
            document.getElementById('amount').value = cleanAmt;
            
            if (rawAmtStr.includes('-') || text.toLowerCase().includes('withdrawal')) {
                document.getElementById('type').value = 'withdrawal';
            } else {
                document.getElementById('type').value = 'deposit';
            }

            let cleanedPayee = text.replace(matchDate[0], '').replace(rawAmtStr, '').trim();
            cleanedPayee = cleanedPayee.replace(/^[-–—\s]+|[-–—\s]+$/g, '');
            if (cleanedPayee) {
                document.getElementById('payee').value = cleanedPayee;
            }
            
            setTimeout(() => { e.target.value = ''; }, 300);
        }
    });

    async function loadLedger() {
        const listEl = document.getElementById('ledgerList');
        listEl.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Fetching from Apps Script...</div>';

        try {
            const response = await fetch(WEB_APP_URL + '?action=recent', {
                method: 'GET',
                mode: 'cors'
            });
            const data = await response.json();
            
            if (data.status === 'success') {
                if (data.latestBalance) {
                    document.getElementById('latestSheetBalanceInput').value = data.latestBalance;
                    checkBalanceMath();
                }
                allEntries = data.entries || [];
                renderLedger(allEntries);
            } else {
                listEl.innerHTML = `<div style="text-align:center; color:#ff6b6b; padding:10px;">Backend Error: ${data.message || 'Unknown'}</div>`;
            }
        } catch (err) {
            console.error("Fetch error details:", err);
            listEl.innerHTML = `<div style="text-align:center; color:#ff6b6b; padding:10px;">Network/CORS Blocked. Check Console.</div>`;
        }
    }

    function markAsCleared(rowIndex, payee, amount, type) {
        const prefix = type === 'deposit' ? '+' : '-';
        const confirmMsg = `Are you sure you want to clear this transaction?\n\nPayee: ${payee}\nAmount: ${prefix}$${amount}\n\nThis will mark it with an 'x' and turn the sheet row white.`;
        
        if (!confirm(confirmMsg)) return;

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'clear', rowIndex: rowIndex })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success') {
                loadLedger();
            } else {
                alert('Could not clear transaction.');
            }
        })
        .catch(err => console.error(err));
    }

    function checkBalanceMath() {
        const bankBal = parseFloat(document.getElementById('bankBalanceInput').value);
        const sheetBal = parseFloat(document.getElementById('latestSheetBalanceInput').value);
        const floatBal = parseFloat(document.getElementById('pendingFloatInput').value);
        const statusBox = document.getElementById('verifyStatusBox');

        if (isNaN(bankBal)) {
            statusBox.style.background = '#2a2a2a';
            statusBox.style.color = '#aaa';
            statusBox.innerHTML = 'Enter your current bank balance to verify';
            return;
        }

        const expectedSheet = bankBal - floatBal;
        const diff = Math.abs(expectedSheet - sheetBal);

        if (diff < 0.02) {
            statusBox.style.background = 'rgba(46, 125, 50, 0.3)';
            statusBox.style.color = '#81c784';
            statusBox.innerHTML = '✅ <strong>Balanced! Ready to certify.</strong>';
        } else {
            statusBox.style.background = 'rgba(198, 40, 40, 0.3)';
            statusBox.style.color = '#ef5350';
            statusBox.innerHTML = `⚠️ Off by $${diff.toFixed(2)} (Expected sheet: $${expectedSheet.toFixed(2)})`;
        }
    }

    document.getElementById('bankBalanceInput').addEventListener('input', checkBalanceMath);

    document.getElementById('balanceBtn').addEventListener('click', () => {
        const bankBal = parseFloat(document.getElementById('bankBalanceInput').value || 0);
        const sheetBal = parseFloat(document.getElementById('latestSheetBalanceInput').value || 0);
        const floatBal = parseFloat(document.getElementById('pendingFloatInput').value || 0);

        if (isNaN(bankBal) || bankBal === 0) {
            alert('Please enter your current bank balance first.');
            return;
        }

        const expectedSheet = bankBal - floatBal;
        const diff = Math.abs(expectedSheet - sheetBal);

        if (diff >= 0.02) {
            if (!confirm(`⚠️ Warning: Your numbers don't match by $${diff.toFixed(2)}.\n\nDo you still want to force-mark the checkbook as balanced?`)) {
                return;
            }
        } else {
            if (!confirm("🎉 Everything matches perfectly!\n\nMark your register with your balancing note?")) {
                return;
            }
        }

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'balance' })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success') {
                alert("Checkbook successfully marked as balanced! ❤️\nNote logged in register.");
            } else {
                alert('Error marking balance note.');
            }
        })
        .catch(err => console.error(err));
    });

    function renderLedger(entries) {
        const listEl = document.getElementById('ledgerList');
        listEl.innerHTML = '';

        if (!entries || entries.length === 0) {
            listEl.innerHTML = '<div style="text-align: center; color: #777; padding: 20px;">No history found.</div>';
            return;
        }

        let pendingCount = 0;
        let pendingTotal = 0;

        entries.forEach((item) => {
            const isPending = !item.status || item.status.toLowerCase() !== 'x';
            const amt = parseFloat(item.amount || 0);

            if (isPending) {
                pendingCount++;
                if (item.type === 'deposit') {
                    pendingTotal += amt;
                } else {
                    pendingTotal -= amt;
                }
            }

            const div = document.createElement('div');
            div.className = 'ledger-item' + (isPending ? ' pending' : '');
            div.style.cursor = isPending ? 'pointer' : 'default';
            div.title = isPending ? 'Click to verify and clear transaction' : 'Already cleared';

            if (isPending) {
                div.onclick = () => markAsCleared(item.rowIndex, item.paye, item.amount, item.type);
            }
            
            const prefix = item.type === 'deposit' ? '+' : '-';
            div.innerHTML = `
                <div>
                    <strong>${item.paye}</strong> <span style="font-size:11px; color:#888;">(${item.date})</span>
                </div>
                <div style="color: ${item.type === 'deposit' ? '#81c784' : '#e0e0e0'}">
                    ${prefix}$${item.amount} ${isPending ? ' <span style="font-size:10px; color:#a5d6a7;">[Click to Clear]</span>' : ''}
                </div>
            `;
            listEl.appendChild(div);
        });

        pendingTotal = Math.abs(pendingTotal);

        document.getElementById('pendingCountBadge').innerText = `${pendingCount} pending`;
        document.getElementById('totalPendingBadge').innerText = `Total: $${pendingTotal.toFixed(2)}`;
        document.getElementById('pendingFloatInput').value = pendingTotal.toFixed(2);
        
        checkBalanceMath();
    }

    document.getElementById('searchFilter').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allEntries.filter(item => {
            const matchPayee = item.paye && item.paye.toLowerCase().includes(term);
            const matchAmount = item.amount && item.amount.toString().includes(term);
            return matchPayee || matchAmount;
        });
        renderLedger(filtered);
    });

    document.getElementById('checkbookForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = 'Logging...';
        btn.disabled = true;

        const payload = {
            date: document.getElementById('date').value,
            payee: document.getElementById('payee').value,
            amount: document.getElementById('amount').value,
            type: document.getElementById('type').value,
            category: document.getElementById('category').value,
            statusTag: document.getElementById('statusTag').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            alert('Transaction logged successfully!');
            document.getElementById('checkbookForm').reset();
            const dateInputReset = document.getElementById('date');
            if(dateInputReset) dateInputReset.value = new Date().toISOString().split('T')[0];
            btn.innerText = 'Log Transaction';
            btn.disabled = false;
            loadLedger();
        })
        .catch(err => {
            console.error(err);
            alert('Error logging transaction.');
            btn.innerText = 'Log Transaction';
            btn.disabled = false;
        });
    });

    loadLedger();
</script>

</body>
</html>
